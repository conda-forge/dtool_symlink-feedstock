schema_version: 1

context:
  name: dtool_symlink
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-symlink/dtool-symlink-${{ version }}.tar.gz
  sha256: 8d3d4cce64c5fdb5aafe7e4c4dd07fb3e57b0ff8308ed635776d1856e9f26b9b

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - setuptools
    - dtoolcore
    - dtool_cli

tests:
  - python:
      imports:
        - dtool_symlink
        - dtool_symlink.storagebroker
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE.rst
  summary: give dtool ability to create dataset where data directory is a symlink.
  homepage: https://github.com/jic-dtool/dtool-symlink
  repository: https://github.com/jic-dtool/dtool-symlink
  documentation: https://github.com/jic-dtool/dtool-symlink

extra:
  recipe-maintainers:
    - pvanheus
    - jan-janssen
    - tjelvar-olsson
